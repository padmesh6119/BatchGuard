<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BatchGuard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee; --surface-3: #ebeae4;
  --border: rgba(11,11,11,.10); --grid: #e1e0d9; --axis: #c3c2b7;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --real: #2a78d6; --sim: #eb6834; --qual: #1baf7a; --s4: #eda100; --violet: #6250d6; --neutral: #b5b3ab; --neutral-2: #d6d4cc;
  --real-wash: rgba(42,120,214,.10); --sim-wash: rgba(235,104,52,.12);
  --critical: #d03b3b; --critical-wash: rgba(208,59,59,.09); --good: #006300; --warning: #b07800;
  --shadow: 0 1px 2px rgba(11,11,11,.06), 0 4px 16px rgba(11,11,11,.04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2c2c2a;
    --border: rgba(255,255,255,.10); --grid: #2c2c2a; --axis: #383835;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --real: #3987e5; --sim: #d95926; --qual: #199e70; --s4: #c98500; --violet: #9085e9; --neutral: #5f5e5a; --neutral-2: #45443f;
    --real-wash: rgba(57,135,229,.16); --sim-wash: rgba(217,89,38,.18);
    --critical: #e66767; --critical-wash: rgba(230,103,103,.13); --good: #0ca30c; --warning: #fab219;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2c2c2a;
  --border: rgba(255,255,255,.10); --grid: #2c2c2a; --axis: #383835;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --real: #3987e5; --sim: #d95926; --qual: #199e70; --s4: #c98500; --violet: #9085e9; --neutral: #5f5e5a; --neutral-2: #45443f;
  --real-wash: rgba(57,135,229,.16); --sim-wash: rgba(217,89,38,.18);
  --critical: #e66767; --critical-wash: rgba(230,103,103,.13); --good: #0ca30c; --warning: #fab219;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
.num, td.n, .tnum { font-variant-numeric: tabular-nums; }
a { color: var(--real); }

/* banner + header */
.banner { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center;
  padding: 8px 20px; background: var(--ink); color: var(--surface); font-size: 13px; }
.banner .layer { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; letter-spacing: .01em; }
.banner .dot { width: 9px; height: 9px; border-radius: 50%; }
.banner .note { opacity: .82; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 16px 20px 0; max-width: 1480px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { flex: none; }
.brand h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--ink-2); font-size: 13px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.meta { color: var(--ink-2); font-size: 13px; }
.meta b { color: var(--ink); font-weight: 600; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 9px; cursor: pointer; }
nav.tabs { display: flex; gap: 4px; padding: 12px 20px 0; max-width: 1480px; margin: 0 auto; border-bottom: 1px solid var(--border); }
nav.tabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
main { max-width: 1480px; margin: 0 auto; padding: 16px 20px 40px; }
section[hidden] { display: none; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.card > h2, .card-h { display: flex; align-items: baseline; gap: 10px; margin: 0; padding: 14px 16px 10px; font-size: 15px; }
.card-h h2 { font-size: 15px; margin: 0; }
.card-h .sub, .sub { color: var(--muted); font-size: 12.5px; font-weight: 400; }
.card-b { padding: 0 16px 16px; }
.grow { margin-left: auto; }
h3 { font-size: 13px; margin: 18px 0 8px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.section-title { display: flex; align-items: center; gap: 10px; margin: 26px 0 12px; }
.section-title h2 { margin: 0; font-size: 17px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); background: var(--surface-2); white-space: nowrap; }
.tag .dot { width: 7px; height: 7px; border-radius: 50%; }
.tag.real .dot { background: var(--real); } .tag.sim .dot { background: var(--sim); }
.tag.crit { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, transparent); background: var(--critical-wash); }
.muted { color: var(--muted); } .ink2 { color: var(--ink-2); }
.callout { border-left: 3px solid var(--real); background: var(--real-wash); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 12px 0; }
.callout.sim { border-color: var(--sim); background: var(--sim-wash); }
.callout.plain { border-color: var(--axis); background: var(--surface-2); }

/* controls */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding: 12px 16px; }
.controls .group { display: flex; align-items: center; gap: 8px; }
.controls label { color: var(--ink-2); font-size: 13px; }
.ctrl { border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; height: 32px; min-width: 34px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.ctrl:hover { background: var(--surface-3); }
.ctrl.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600; min-width: 92px; }
input[type="range"] { accent-color: var(--ink); }
#scanRange { width: min(340px, 42vw); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: var(--surface-2); width: 30px; height: 32px; cursor: pointer; }
.stepper output { min-width: 40px; text-align: center; font-weight: 700; font-size: 15px; }
.clock { font-weight: 600; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 12px 0; }
.kpi { padding: 12px 16px; }
.kpi .label { color: var(--ink-2); font-size: 12.5px; }
.kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -.01em; margin-top: 2px; display: flex; align-items: center; gap: 8px; }
.kpi .value .small { font-size: 14px; font-weight: 500; color: var(--ink-2); }
.kpi .foot { color: var(--muted); font-size: 12px; margin-top: 2px; }
.kpi.alert .value { color: var(--critical); }
.decision-notes { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 1fr); gap: 12px; margin: 0 0 12px; }
.decision-note { padding: 14px 16px; border-left: 3px solid var(--real); }
.decision-note.unknown { border-left-color: var(--s4); }
.decision-note h2 { margin: 0 0 4px; font-size: 14px; }
.decision-note p { margin: 3px 0 0; color: var(--ink-2); font-size: 12.5px; }
.strategy-table { width: 100%; margin-top: 8px; font-size: 12.5px; }
.strategy-table th { font-size: 10.5px; padding: 5px 6px; }
.strategy-table td { padding: 5px 6px; }
.strategy-table tr.current { background: var(--real-wash); font-weight: 650; }
.decision-note .ctrl { margin-top: 9px; height: 30px; font-size: 12px; }

/* decision grid */
.grid { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(320px, 1fr); gap: 12px; align-items: start; }
.side { display: grid; gap: 12px; }
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 8px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
td.n, th.n { text-align: right; }
.queue tbody tr.row { cursor: pointer; transition: background .15s; }
.queue tbody tr.row:hover { background: var(--surface-2); }
.queue tbody tr.row:focus-visible { outline: 2px solid var(--real); outline-offset: -2px; }
.queue tr.row.selected { background: var(--real-wash); }
.queue tr.row.alert td:first-child { box-shadow: inset 3px 0 0 var(--critical); }
.queue tr.row.below { opacity: .55; }
.queue tr.row.below:hover, .queue tr.row.below.selected { opacity: .9; }
.queue tr.row.fresh { animation: fresh 1.4s ease-out; }
@keyframes fresh { from { background: var(--sim-wash); } to { background: transparent; } }
.rank { font-size: 17px; font-weight: 700; width: 44px; white-space: nowrap; }
.delta { font-size: 11px; font-weight: 600; margin-left: 2px; }
.delta.up { color: var(--good); } .delta.down { color: var(--muted); } .delta.new { color: var(--sim); }
.bt { font-weight: 650; }
.pd { color: var(--ink-2); font-size: 12.5px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mf { color: var(--muted); font-size: 11.5px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter { display: flex; align-items: center; gap: 7px; min-width: 96px; }
.meter .track { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; min-width: 50px; }
.meter .fill { height: 100%; border-radius: 0 3px 3px 0; }
.meter .v { width: 24px; text-align: right; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.prio { font-weight: 700; font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
td.who { min-width: 230px; max-width: 320px; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
.chip.crit { color: var(--critical); background: var(--critical-wash); border-color: transparent; font-weight: 600; }
.chip.real { color: var(--ink-2); box-shadow: inset 2px 0 0 var(--real); }
.status { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.status.s1 { background: var(--real-wash); color: var(--ink); } .status.s3 { background: var(--critical-wash); color: var(--critical); } .status.s2 { color: var(--ink-2); }
tr.cap td { padding: 6px 8px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 600; border-top: 2px dashed var(--axis); }

/* map + feed */
.map svg { width: 100%; max-width: 360px; height: auto; display: block; margin: 0 auto; }
.map .land { fill: var(--surface-2); stroke: var(--axis); stroke-width: 1; }
.map .grat { stroke: var(--grid); stroke-width: 1; fill: none; }
.map .city text { font-size: 11px; fill: var(--ink-2); }
.map .pulse { animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(3.2); } }
.feed { max-height: 420px; overflow-y: auto; }
.feed ol { list-style: none; margin: 0; padding: 0 8px 8px; }
.feed li { display: grid; grid-template-columns: 62px 1fr auto; gap: 2px 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; align-items: center; }
.feed li:hover { background: var(--surface-2); }
.feed li.latest { background: var(--sim-wash); }
.feed li.retry { opacity: .6; }
.feed .t { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.feed .w { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed .w .p { color: var(--muted); font-size: 11.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); padding: 0 16px 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* evidence */
.evidence { margin-top: 12px; }
.ev-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 16px; border-bottom: 1px solid var(--grid); }
.ev-head .rk { font-size: 28px; font-weight: 750; color: var(--ink-2); }
.ev-head .bt { font-size: 19px; }
.ev-body { padding: 16px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
.signals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.signal { border: 1px solid var(--border); border-radius: 10px; padding: 12px; position: relative; overflow: hidden; }
.signal::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--c); }
.signal .k { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.signal .v { font-size: 26px; font-weight: 700; margin: 2px 0 4px; }
.signal .why { font-size: 12.5px; color: var(--ink-2); }
.formula { margin-top: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; font-size: 13px; color: var(--ink-2); }
.formula b { color: var(--ink); }
.reasons { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.reasons li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; font-size: 13px; }
.reasons code { font-size: 11px; background: var(--surface-2); padding: 1px 6px; border-radius: 4px; color: var(--ink-2); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--grid); }
.timeline li { position: relative; padding: 4px 0 8px 10px; font-size: 13px; }
.timeline li::before { content: ""; position: absolute; left: -20px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--sim); box-shadow: 0 0 0 2px var(--surface); }
.timeline li.retry::before { background: var(--neutral); }
.timeline .t { font-variant-numeric: tabular-nums; color: var(--ink-2); margin-right: 6px; }
.tbl-wrap { max-height: 300px; overflow: auto; border: 1px solid var(--grid); border-radius: 8px; }
.tbl-wrap table th { position: sticky; top: 0; background: var(--surface); }
.small-tbl td, .small-tbl th { font-size: 12.5px; padding: 6px 8px; }
.decide { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.decide button { border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.decide button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
textarea { width: 100%; min-height: 54px; border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--surface); resize: vertical; }
.saved { color: var(--good); font-size: 12.5px; margin-left: 8px; }

/* charts */
.charts2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.charts3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--axis); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart text.lbl { fill: var(--ink-2); font-size: 12px; }
.chart text.val { fill: var(--ink); font-size: 12px; font-weight: 600; }
.chart .mark { transition: opacity .12s; }
.chart .mark:hover, .chart .mark:focus { opacity: .78; outline: none; }
.chart .xhair { stroke: var(--axis); stroke-width: 1; }
details.tv { margin-top: 8px; font-size: 12.5px; }
details.tv summary { cursor: pointer; color: var(--ink-2); }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 6px 24px rgba(0,0,0,.14); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 120px; display: none; }
#tip .h { color: var(--ink-2); margin-bottom: 4px; }
#tip .r { display: flex; align-items: center; gap: 8px; }
#tip .r b { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.hosts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.host dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 13px; }
.host dt { color: var(--muted); } .host dd { margin: 0; }
.empty { padding: 24px 16px; color: var(--ink-2); text-align: center; }
code.cmd { background: var(--surface-2); padding: 2px 6px; border-radius: 4px; font-size: 12.5px; }
footer { max-width: 1480px; margin: 0 auto; padding: 0 20px 32px; color: var(--muted); font-size: 12px; }
@media (max-width: 1100px) { .grid, .ev-body, .charts2, .charts3, .hosts, .decision-notes { grid-template-columns: minmax(0, 1fr); } .kpis, .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .signals { grid-template-columns: minmax(0, 1fr); } .kpis, .stats { grid-template-columns: minmax(0, 1fr); } header.top, nav.tabs, main { padding-left: 16px; padding-right: 16px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="banner" role="note">
  <span class="layer"><span class="dot" style="background:#5598e7"></span>Layer A · REAL CDSCO data</span>
  <span class="layer"><span class="dot" style="background:#ff8a5c"></span>Layer B · SIMULATED scans</span>
  <span class="note">A scan anomaly is not proof of counterfeit. Inspectors decide; nothing is blocked automatically.</span>
</div>
<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 2 L30 7 V16 C30 24 24 30 17 32 C10 30 4 24 4 16 V7 Z" fill="var(--ink)"/><path d="M11 17 l4 4 l8 -9" stroke="var(--surface)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><h1>BatchGuard</h1><p>Which batches to sample first within this week's capacity</p></div>
  </div>
  <span class="meta" id="clockMeta"></span>
  <span class="meta">Backend <span class="seg" id="backendSeg"></span></span>
  <button class="icon-btn" id="themeBtn" title="Toggle light/dark">◐</button>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="decision" aria-selected="true">Decision</button>
  <button role="tab" data-tab="evaluation" aria-selected="false">Evaluation</button>
  <button role="tab" data-tab="platform" aria-selected="false">Platform</button>
  <button role="tab" data-tab="data" aria-selected="false">Data</button>
</nav>
<main>
  <section id="decision"></section>
  <section id="evaluation" hidden></section>
  <section id="platform" hidden></section>
  <section id="data" hidden></section>
</main>
<footer id="foot"></footer>
<div id="tip" role="tooltip"></div>
<script id="bg-data" type="application/json">/*__BATCHGUARD_DATA__*/null</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("bg-data").textContent);
const NS = "http://www.w3.org/2000/svg";
const STATUSES = [["unreviewed", "Unreviewed"], ["sample requested", "Sample requested"], ["reviewed - no sample", "Reviewed, no sample"], ["escalated to laboratory", "Escalated to lab"]];
const REASONS = {
  CLONE_PATTERN_TRAVEL_REVIEW: ["Impossible travel", "One pack seen at least 100 km apart faster than 900 km/h (simulated scans).", "crit"],
  REPEATED_PACK_BURST_REVIEW: ["Repeated-pack burst", "Ten or more scans of one pack within 5 minutes (simulated scans).", "crit"],
  SCAN_CAUSE_UNVERIFIED: ["Cause unverified", "A scan pattern can also result from GPS, clock, or repeated-scan errors. Verify the source and pack before drawing conclusions.", ""],
  PRIOR_NSQ_RECORDS: ["prior NSQ", "Earlier NSQ records with this manufacturer text (real CDSCO lists).", "real"],
  REPORTED_IN_LAST_3_MONTHS: ["in last 3 mo", "NSQ records in the three months before the decision (real).", "real"],
  MANUFACTURER_HISTORY: ["Has history", "Manufacturer text appears in earlier CDSCO lists.", ""],
  NO_EARLIER_MANUFACTURER_HISTORY: ["No history", "No earlier record for this manufacturer text. Absence of history is not evidence of quality.", ""],
  BATCH_REPORT_REFERENCE: ["Batch reported before", "This exact product and batch appear in an earlier published report.", "real"],
  SPURIOUS_REPORT_REFERENCE: ["Spurious report", "This exact batch appears in an earlier spurious-drug report.", "crit"],

  if (!ev) { root.replaceChildren(el("div", { class: "card empty", text: "No evaluation yet. Run python -m src.fusion run, then rebuild the dashboard." })); return; }
  const A = ev.layer_a, B = ev.layer_b, F = ev.fusion, gain = A.ap_gain_vs_strongest_baseline, rec = D.recurrence;
  const apItems = Object.entries(A.average_precision).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ label: RANKERS[k] || k, value: v, metric: "Average precision", color: k === "trained_model" ? "var(--real)" : "var(--neutral)" }));
  const budgets = Object.keys(A.reports_captured_by_budget).map(Number).sort((a, b) => a - b);
  const capture = budgets.map(b => {
    const row = A.reports_captured_by_budget[b];
    const best = Object.entries(row).filter(([k]) => k !== "trained_model" && k !== "random_expectation").sort((a, c) => c[1] - a[1])[0];
    return { label: `Top ${b}`, values: [row.trained_model, best[1], row.random_expectation], note: `best baseline: ${RANKERS[best[0]].toLowerCase()}` };
  });
  const capMax = Math.max(...capture.flatMap(c => c.values));
  const fusionBudgets = Object.keys(F.test_by_budget).map(Number).sort((a, b) => a - b);
  const fusedKey = "fused_" + F.selected_on_validation;
  const pol = Object.entries(POLICY).map(([k, [name, color]]) => ({ key: k === "fused" ? fusedKey : k, name: k === "fused" ? `${name} (${F.selected_on_validation})` : name, color: `var(${color})` }));
  const fusionSeries = what => pol.map(p => ({ name: p.name, color: p.color, values: fusionBudgets.map(n => F.test_by_budget[n][p.key][what]), width: p.key === fusedKey ? 3 : 2 }));
  const fams = ev.families.map(f => ({ label: f.scenario.replace(/_/g, " "), note: `${f.clone_label ? "clone" : "benign"}${f.held_out_family ? " · held out" : ""}`, values: [f.rule_alert_rate, f.model_alert_rate] }));
  const conf = (name, v) => [name, pct(v.precision, 1), pct(v.recall, 1), fmt(v.true_positives), fmt(v.false_positives), fmt(v.false_negatives)];
  const months = ev.fusion_months;

  root.replaceChildren(
    el("div", { class: "section-title" }, el("span", { class: "tag real" }, el("span", { class: "dot" }), "real data"), el("h2", { text: "Layer A · Will this manufacturer be reported again next month?" })),
    el("p", { class: "ink2", text: `Held-out test months ${A.test_months.join(" and ")}: ${fmt(A.test_examples)} earlier manufacturer texts, ${A.test_positives} reported again. Model ${A.selected} was chosen on the June 2026 validation month; the test months were read once.` }),
    el("div", { class: "charts2" },
      card("Average precision on held-out months", "higher is better",
        hBars(apItems, { format: v => fmt(v, 3) }),
        el("div", { class: "callout" }, `AP gain over the strongest validation baseline (${(RANKERS[A.strongest_baseline] || "").toLowerCase()}): `, el("b", { text: `+${fmt(gain.mean, 3)}` }), `, bootstrap 95% CI ${fmt(gain.ci95[0], 3)} to ${fmt(gain.ci95[1], 3)} (${gain.rounds} resamples, ${pct(gain.share_above_zero, 1)} above zero).`),
        tableView(["Ranker", "Average precision"], apItems.map(i => [i.label, fmt(i.value, 4)]))),
      card("Later NSQ reports captured at equal budget", "Jul + Aug 2026, top-K manufacturers per month",
        legend([["Trained model", "var(--real)"], ["Best baseline at that budget", "var(--neutral)"], ["Random (expected)", "var(--neutral-2)"]], false),
        groupedBars(capture.map(c => ({ ...c, values: c.values.map(v => v / capMax) })), [["Trained model", "var(--real)"], ["Best baseline", "var(--neutral)"], ["Random", "var(--neutral-2)"]], { format: v => fmt(v * capMax, 1), label: 210 }),
        el("p", { class: "sub", text: `${A.reachable_reports} of ${A.all_reports} test-month NSQ reports came from manufacturer texts seen earlier; new texts cannot be ranked from history.` }),
        tableView(["Budget", ...Object.keys(RANKERS).map(k => RANKERS[k])], budgets.map(b => [`Top ${b}`, ...Object.keys(RANKERS).map(k => fmt(A.reports_captured_by_budget[b][k], 2))])))),
    rec ? el("div", { class: "callout plain" }, el("b", { text: "Recurrence finding. " }), `With history through ${rec.history_through}, ${fmt(rec.previously_seen_pct, 1)}% (${fmt(rec.previously_seen_text_records)} of ${fmt(rec.later_records)}) of later NSQ records carried exact manufacturer text seen earlier. This is one measured split, not a prediction ceiling, and says nothing about scan detection.`) : null,

    el("div", { class: "section-title" }, el("span", { class: "tag sim" }, el("span", { class: "dot" }), "simulated data"), el("h2", { text: "Layer B · Does a scan pattern look like a copied pack?" })),
    el("div", { class: "charts2" },
      card("Rule vs trained model on test episodes", `${B.model.true_positives + B.model.false_negatives} simulated clone episodes`,
        el("table", { class: "small-tbl" }, el("thead", {}, el("tr", {}, ["Detector", "Precision", "Recall", "TP", "FP", "FN"].map((h, i) => el("th", { class: i ? "n" : "", text: h })))),
          el("tbody", {}, [conf("Declared rule (drives alerts)", B.rule), conf(`Trained ${B.selected}`, B.model)].map(r => el("tr", {}, r.map((c, i) => el("td", { class: i ? "n" : "", text: c })))))),
        el("div", { class: "callout sim" }, "The trained model did not beat the rule on families it never saw, and a separate nuisance challenge exposed many benign alerts. ", el("b", { text: "Only the declared rule drives scan review flags." }), " The model's synthetic score is diagnostic, not a counterfeit probability.")),
      card("Alert rate by scenario family", "clone families should alert; benign ones should not",
        legend([["Declared rule", "var(--sim)"], ["Trained model", "var(--qual)"]], false),
        groupedBars(fams, [["Declared rule", "var(--sim)"], ["Trained model", "var(--qual)"]], { label: 190 }),
        tableView(["Family", "Label", "Episodes", "Rule alert", "Model alert"], ev.families.map(f => [f.scenario, (f.clone_label ? "clone" : "benign") + (f.held_out_family ? ", held out" : ""), fmt(f.episodes), pct(f.rule_alert_rate, 1), pct(f.model_alert_rate, 1)])))),
    D.scan_learning_curve ? card("Does more scripted training help?", `${D.scan_learning_curve.fixed_test_episodes} fixed scripted test episodes · ${D.scan_learning_curve.challenge_cases} stress cases`,
      tableView(["Train episodes", "Fixed test AP", "Benign stress alerts", "Missed copied IDs"],
        D.scan_learning_curve.rows.map(r => [fmt(r.training_episodes), fmt(r.fixed_test_ap, 3), fmt(r.challenge_fp), fmt(r.challenge_fn)])),
      el("p", { class: "sub", text: "More examples of the same scripts did not resolve the stress cases. These are artificial mixtures, not field accuracy. The model does not add operational alerts." })) : null,

    el("div", { class: "section-title" }, el("h2", { text: "Fusion · One queue, two risks" })),
    el("p", { class: "ink2", text: `Held-out queues built through the live ranking code. Only batches published before each month enter its queue (${months.map(x => `${monthLong(x.month)}: ${x.candidates} batches, ${x.clones} simulated clones, ${x.recurring} real recurring-manufacturer batches`).join("; ")}). Policy ${F.selected_on_validation} was chosen on the ${ev.validation_month} validation queue.` }),
    legend(pol.map(p => [p.name, p.color])),
    el("div", { class: "charts2" },
      card("Simulated clones captured", "share of clones inside the queue's top N", lineChart({ xs: fusionBudgets, series: fusionSeries("clone"), xLabel: "queue size N", title: "Clones captured" })),
      card("Real recurring-manufacturer batches captured", "share inside the queue's top N", lineChart({ xs: fusionBudgets, series: fusionSeries("recurrence"), xLabel: "queue size N", title: "Recurring batches captured" }))),
    tableView(["N", ...pol.flatMap(p => [`${p.name}: clones`, "recurring"])], fusionBudgets.map(n => [n, ...pol.flatMap(p => [pct(F.test_by_budget[n][p.key].clone, 1), pct(F.test_by_budget[n][p.key].recurrence, 1)])]), "Table view of both charts"),
    el("div", { class: "callout plain" }, el("b", { text: "Read with care. " }), `Recurring batches per month are few (${months.map(x => x.recurring).join(" and ")}), so those shares move in large steps. At small budgets, scan alerts can consume every slot; the combined policy does not improve both targets at every N. Compare the selected policy with both single-signal baselines at the budget you can actually use.`),
    D.limits.length ? el("ul", { class: "ink2" }, D.limits.map(l => el("li", { text: l }))) : null);
}

/* ---------- platform ---------- */
function renderPlatform() {
  const root = document.getElementById("platform"), B = D.benchmarks;
  const hostCard = (key, title) => {
    const b = B[key];
    if (!b) return el("div", { class: "card host" }, el("div", { class: "card-h" }, el("h2", { text: title }), el("span", { class: "tag", text: "not measured yet" })),
      el("div", { class: "card-b" }, el("p", { class: "ink2", text: "No run recorded on this host. On LinuxONE:" }),
        el("p", {}, el("code", { class: "cmd", text: "python3 -m src.fusion run && python3 -m src.fusion benchmark" })),
        el("p", { class: "sub", text: "Then commit outputs/benchmark_linuxone.json and rebuild this page with python -m app.dashboard." })));
    return el("div", { class: "card host" }, el("div", { class: "card-h" }, el("h2", { text: title }), el("span", { class: "tag", text: b.machine })),
      el("div", { class: "card-b" }, el("dl", {},
        el("dt", { text: "CPU" }), el("dd", { text: `${b.cpu}${b.cpus ? ` · ${b.cpus} CPUs available` : ""}` }),
        el("dt", { text: "NNPA facility listed" }), el("dd", { text: b.nnpa_listed ? "yes (listed only; no use is claimed)" : "no" }),
        el("dt", { text: "Python" }), el("dd", { text: b.python }),
        el("dt", { text: "Packages" }), el("dd", { text: Object.entries(b.packages).filter(([, v]) => v !== "not installed").map(([k, v]) => `${k} ${v}`).join(" · ") }),
        el("dt", { text: "Workload" }), el("dd", { text: `${fmt(b.workload.events)} events, ${fmt(b.workload.episodes)} episodes, ${b.workload.repeats} repeats · sha ${b.workload_sha256}` }),
        el("dt", { text: "Measured" }), el("dd", { text: b.created_at.slice(0, 16).replace("T", " ") + " UTC" }))));
  };
  const runs = [];
  for (const host of ["laptop", "linuxone"]) if (B[host]) for (const [backend, v] of Object.entries(B[host].backends)) runs.push({ host, backend, v, color: host === "linuxone" ? "var(--violet)" : "var(--neutral)" });
  const name = r => `${r.host === "linuxone" ? "LinuxONE" : "Laptop"} · ${r.backend === "snapml" ? "Snap ML" : "scikit-learn"}`;
  const stageRows = Object.keys(STAGES).map(s => [STAGES[s], ...runs.map(r => r.v.stages[s] ? `${fmt(r.v.stages[s].p50, 2)} / ${fmt(r.v.stages[s].p99, 2)}` : "–")]);
  root.replaceChildren(
    el("div", { class: "section-title" }, el("h2", { text: "Same workload, measured on each machine" })),
    el("p", { class: "ink2", text: B.laptop ? B.laptop.scope : "Single process, sequential, in memory, data preloaded." }),
    el("div", { class: "hosts" }, hostCard("laptop", "Laptop"), hostCard("linuxone", "IBM LinuxONE")),
    runs.length ? el("div", { class: "charts2", style: "margin-top:12px" },
      card("Per-scan decision latency", "median (p50), milliseconds; lower is better",
        hBars(runs.map(r => ({ label: name(r), value: r.v.stages.per_scan_decision_ms.p50, color: r.color, metric: "p50 ms", extra: [["p99 ms", fmt(r.v.stages.per_scan_decision_ms.p99, 2)]] })), { format: v => fmt(v, 2) + " ms", label: 170 })),
      card("Throughput", "events per second, end to end; higher is better",
        hBars(runs.map(r => ({ label: name(r), value: r.v.events_per_second, color: r.color, metric: "events/s" })), { format: v => fmt(v), label: 170 }))) : null,
    runs.length ? card("Stage timings", "p50 / p99 milliseconds", el("div", { class: "scroll-x" }, el("table", { class: "small-tbl" },
      el("thead", {}, el("tr", {}, el("th", { text: "Stage" }), runs.map(r => el("th", { class: "n", text: name(r) })))),
      el("tbody", {}, stageRows.map(r => el("tr", {}, r.map((c, i) => el("td", { class: i ? "n" : "", text: c })))))))) : null,
    el("div", { class: "callout plain", style: "margin-top:12px" }, "Queue rebuild uses a cached monthly history context; the first context build is measured separately above. Machines differ in allocation, so no speedup is claimed from these numbers alone. Hardware acceleration is claimed only from a separately configured and measured run."));
}

/* ---------- data ---------- */
function renderData() {
  const root = document.getElementById("data"), d = D.data, s = d.summary || {}, cats = s.categories || {};
  const months = d.monthly.map(r => r.collection_month);
  const cols = d.monthly.map(r => ({ label: monthName(r.collection_month), values: [r.central_nsq || 0, r.state_nsq || 0, d.spurious_monthly[r.collection_month] || 0] }));
  const series = [["Central NSQ", "var(--real)"], ["State NSQ", "var(--qual)"], ["Spurious", "var(--s4)"]];
  const stat = (label, value, foot) => el("div", { class: "card kpi" }, el("div", { class: "label", text: label }), el("div", { class: "value", text: value }), foot ? el("div", { class: "foot", text: foot }) : null);
  const avail = d.availability;
  root.replaceChildren(
    el("div", { class: "section-title" }, el("span", { class: "tag real" }, el("span", { class: "dot" }), "real data"), el("h2", { text: "CDSCO monthly lists" })),
    el("div", { class: "stats" },
      stat("Analytical records", fmt(s.analytical_records), months.length ? `${monthLong(months[0])} to ${monthLong(months[months.length - 1])}` : ""),
      stat("Central NSQ", fmt(cats.central_nsq), "Not of Standard Quality, central list"),
      stat("State NSQ", fmt(cats.state_nsq), "Not of Standard Quality, state lists"),
      stat("Spurious-drug records", fmt(cats.spurious), "Allegations; manufacturer may deny")),
    el("div", { style: "margin-top:12px" }, card("Records per collection month", "stacked by list",
      legend(series, false), stackedColumns(cols, series),
      tableView(["Month", "Central NSQ", "State NSQ", "Spurious"], cols.map(c => [c.label, ...c.values.map(v => fmt(v))])))),
    el("div", { class: "charts2", style: "margin-top:12px" },
      card("Missing evidence", "share of records with an empty field",
        hBars(d.missing.map(m => ({ label: m.field.replace(/_/g, " "), value: m.missing / m.records, color: "var(--neutral)", metric: "Missing", extra: [["Records", `${fmt(m.missing)} of ${fmt(m.records)}`]] })), { format: v => pct(v, 1), max: 1, label: 200 }),
        el("p", { class: "sub", text: "Normalized manufacturer text is not a verified legal identity; variants are not merged without review." })),
      card("Failure-type mapping", "how each failure text was classified",
        hBars(d.mapping.map(m => ({ label: m.status.replace(/_/g, " "), value: m.records, color: "var(--neutral)", metric: "Records" })), { format: v => fmt(v), label: 200 }))),
    avail.length ? el("div", { style: "margin-top:12px" }, card("Source availability", "one row per monthly workbook", el("div", { class: "scroll-x" }, el("table", { class: "small-tbl" },
      el("thead", {}, el("tr", {}, Object.keys(avail[0]).map(k => el("th", { text: k.replace(/_/g, " ") })))),
      el("tbody", {}, avail.map(r => el("tr", {}, Object.values(r).map(v => el("td", { text: v }))))))),
      el("p", { class: "sub", text: "An absent spurious sheet means unavailable source data, not zero incidents." }))) : null,
    el("p", { class: "sub", text: `Processed data manifest sha256 ${d.manifest_sha256.slice(0, 16)}… · every file is hash-checked when the pipeline loads it.` }));
}

function renderAll() {
  renderHeader(); renderDecision(); renderEvaluation(); renderPlatform(); renderData();
  document.getElementById("foot").textContent = `Generated ${D.generated_at.replace("T", " ")} from the BatchGuard pipeline · models ${D.backends.map(b => D.models[b].version).join(", ")} · Layer A real CDSCO data, Layer B simulated scans · humans decide.`;
}
let resizeTimer = null;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { renderEvaluation(); renderPlatform(); renderData(); }, 200); });
renderAll();
</script>
</body>
</html>
